apiVersion: apps/v1
kind: Deployment
metadata:
  name: homework-2-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homework-2-client
  template:
    metadata:
      labels:
        app: homework-2-client
    spec:
      containers:
        - name: homework-2-client
          image: localhost:5001/client:v1
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
              ephemeral-storage: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
              ephemeral-storage: "256Mi"
          envFrom:
            - configMapRef:
                name: homework-2-client-config
          # env:
          #   - name: APP_TOKEN
          #     valueFrom:
          #       secretKeyRef:
          #         name: homework-2-credentials
          #         key: APP_TOKEN
          #   - name: POD_NAME
          #     valueFrom:
          #       fieldRef:
          #         fieldPath: metadata.name
          