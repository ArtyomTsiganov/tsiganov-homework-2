apiVersion: apps/v1
kind: Deployment
metadata:
  name: homework-2
spec:
  replicas: 4
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: homework-2
  template:
    metadata:
      labels:
        app: homework-2
    spec:
      containers:
        - name: homework-2
          image: localhost:5001/tsiganov-homework-2:v1.5
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
              ephemeral-storage: "64Mi"
            limits:
              cpu: "500m"
              memory: "1024Mi"
              ephemeral-storage: "256Mi"
          envFrom:
            - configMapRef:
                name: homework-2-config
          env:
            - name: APP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: homework-2-credentials
                  key: APP_TOKEN
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          startupProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 1